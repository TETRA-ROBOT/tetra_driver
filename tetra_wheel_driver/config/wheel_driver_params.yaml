# TETRA Wheel Driver Physical & Communication Parameters
tetra_wheel_driver:
  ros__parameters:
    # 물리 기구학 파라미터 (단위: m)
    wheel_radius: 0.1033       # 바퀴 반경 (m)
    wheel_distance: 0.4330     # 좌우 바퀴 간격 (Wheel base, m)
    tread_width: 0.04          # 타이어 접지 폭 (m)
    
    # 시리얼 통신 설정
    serial_port: "/dev/ttyUSB0"
    baud_rate: 115200
    
    # 제어 및 필터 옵션
    use_ekf_option: true
    publish_tf: true
    odom_frame_id: "odom"
    base_frame_id: "base_footprint"
    
    # 가속도/속도 제한
    max_linear_velocity: 1.0   # m/s
    max_angular_velocity: 1.5  # rad/s
    default_accel_data: 50
