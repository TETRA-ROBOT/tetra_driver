# TETRA Power Driver Parameters
tetra_power_driver:
  ros__parameters:
    # 시리얼 통신 설정
    serial_port: "/dev/ttyUSB1"
    baud_rate: 115200
    
    # 초음파(Sonar) 센서 설정 (단위: m)
    ultrasonic_max_range: 1.0
    ultrasonic_min_range: 0.04
    enable_ultrasonic: false
    
    # 컨베이어 및 부가 장치 옵션
    enable_conveyor: false
    
    # 전원 및 배터리 임계치
    battery_low_threshold: 20   # %
    battery_critical_threshold: 10 # %
