<text class="muted" x="24" y="294" font-size="12">그래서 구동 드라이버는 바퀴에 속도를 주는 중이면 거부하고, 웹 API 는 주행·도킹·태스크 중에 거부합니다. 한도(256 바이트, 2 s)를 늘리지 않습니다.</text></svg>
