<text class="ink" x="224.0" y="102" font-size="11.5" font-weight="700">raw 명령 보냄</text>
<text class="ink" x="435.1" y="234" font-size="12" font-weight="700" text-anchor="middle">이 동안 폴링 패킷·/odom 없음 (최대 timeout_ms + 0.2 s)</text>
