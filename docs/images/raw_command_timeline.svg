<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 314" width="920" height="314" font-family="-apple-system,'Segoe UI','Noto Sans KR','Malgun Gothic',sans-serif" role="img" aria-label="raw_command 와 폴링">
<title>raw_command 와 폴링</title>
<style>
.card{fill:#ffffff;stroke:#d0d7de}
.ink{fill:#1f2328}.muted{fill:#59636e}.white{fill:#ffffff}
.node{fill:#f6f8fa;stroke:#263238;stroke-width:1.5}
.board{fill:#263238}.boardt{fill:#ffffff}.boardm{fill:#b0bec5}
.topic{fill:#ffffff;stroke:#8c959f}
.wire{stroke:#263238;stroke-width:2;fill:none}
.arrow{stroke:#59636e;stroke-width:1.5;fill:none}
.arrowhead{fill:#59636e}
.req{fill:#00897B}.rep{fill:#FBC02D}.rept{fill:#263238}
.hl{fill:#00897B;fill-opacity:.14;stroke:#00897B;stroke-width:1}
.red{fill:#E53935}
.glow{fill:none;stroke:#00897B;stroke-width:2.5}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
@media (prefers-color-scheme: dark){
 .card{fill:#161b22;stroke:#30363d}
 .ink{fill:#e6edf3}.muted{fill:#9198a1}
 .node{fill:#1f262d;stroke:#8b949e}
 .board{fill:#37474f}.boardm{fill:#cfd8dc}
 .topic{fill:#0d1117;stroke:#484f58}
 .wire{stroke:#8b949e}
 .arrow{stroke:#9198a1}.arrowhead{fill:#9198a1}
 .hl{fill:#26a69a;fill-opacity:.22;stroke:#26a69a}
 .glow{stroke:#26a69a}
}

@keyframes sweep{0%{transform:translateX(0)}92%,100%{transform:translateX(820px)}}
@keyframes blink{0%,100%{opacity:.15}50%{opacity:1}}
@keyframes tick{0%{opacity:1}12%,100%{opacity:.25}}
.cur{animation:sweep 7s linear infinite}
.tk{opacity:.25;animation:tick 7s linear infinite}
.gap{animation:blink 1.6s ease-in-out infinite}
.tick{fill:#00897B}.rawb{fill:#E53935}.waitb{fill:#FBC02D}.drainb{fill:#8c959f}
.axis{stroke:#8c959f;stroke-width:1}.curl{stroke:#263238;stroke-width:2}
.mask{fill:#ffffff;fill-opacity:.72}
.gapr{fill:#E53935;fill-opacity:.07;stroke:#E53935;stroke-dasharray:4 3}
@media (prefers-color-scheme: dark){.mask{fill:#161b22}.curl{stroke:#e6edf3}.drainb{fill:#6e7681}.tick{fill:#26a69a}}
@media (prefers-reduced-motion: reduce){.anim{animation:none!important}}</style>
<rect class="card" x="1" y="1" width="918" height="312" rx="14"/>
<text class="ink" x="24" y="36" font-size="18" font-weight="700">~/raw_command 가 도는 동안 그 보드의 폴링은 멈춥니다</text>
<text class="muted" x="24" y="58" font-size="12.5">서비스 콜백은 폴링 루프의 spin_some 안에서 불립니다. 그래서 패킷은 섞이지 않지만, 그동안 폴링 패킷이 나가지 않습니다.</text>
