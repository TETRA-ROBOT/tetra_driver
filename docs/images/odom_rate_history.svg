<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 258" width="900" height="258" font-family="-apple-system,'Segoe UI','Noto Sans KR','Malgun Gothic',sans-serif" role="img" aria-label="/odom 발행 주기 이력">
<title>/odom 발행 주기 이력</title>
<style>
.card{fill:#ffffff;stroke:#d0d7de}
.ink{fill:#1f2328}.muted{fill:#59636e}.white{fill:#ffffff}
.node{fill:#f6f8fa;stroke:#263238;stroke-width:1.5}
.board{fill:#263238}.boardt{fill:#ffffff}.boardm{fill:#b0bec5}
.topic{fill:#ffffff;stroke:#8c959f}
.wire{stroke:#263238;stroke-width:2;fill:none}
.arrow{stroke:#59636e;stroke-width:1.5;fill:none}
.arrowhead{fill:#59636e}
.req{fill:#00897B}.rep{fill:#FBC02D}.rept{fill:#263238}
.hl{fill:#00897B;fill-opacity:.14;stroke:#00897B;stroke-width:1}
.red{fill:#E53935}
.glow{fill:none;stroke:#00897B;stroke-width:2.5}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
@media (prefers-color-scheme: dark){
 .card{fill:#161b22;stroke:#30363d}
 .ink{fill:#e6edf3}.muted{fill:#9198a1}
 .node{fill:#1f262d;stroke:#8b949e}
 .board{fill:#37474f}.boardm{fill:#cfd8dc}
 .topic{fill:#0d1117;stroke:#484f58}
 .wire{stroke:#8b949e}
 .arrow{stroke:#9198a1}.arrowhead{fill:#9198a1}
 .hl{fill:#26a69a;fill-opacity:.22;stroke:#26a69a}
 .glow{stroke:#26a69a}
}

.bar{fill:#00897B}.barold{fill:#8c959f}.grid{stroke:#d0d7de;stroke-width:1}.base{stroke:#8c959f;stroke-width:1}
@media (prefers-color-scheme: dark){.bar{fill:#26a69a}.barold{fill:#6e7681}.grid{stroke:#30363d}}
@media (prefers-reduced-motion: reduce){.anim{animation:none!important}}</style>
<rect class="card" x="1" y="1" width="898" height="256" rx="14"/>
<text class="ink" x="24" y="34" font-size="17" font-weight="700">/odom 발행 주기 — 고치기 전과 후</text>
<text class="muted" x="24" y="54" font-size="12">목표는 폴링 주기 30 Hz. 앞의 두 값은 커밋 메시지(a6e2237, 1c6ebd0)의 기록, 마지막은 실 로봇 측정입니다.</text>
<line class="grid" x1="300.0" y1="70" x2="300.0" y2="226"/>
<text class="muted" x="300.0" y="242" font-size="11" text-anchor="middle">0 Hz</text>
<line class="grid" x1="486.7" y1="70" x2="486.7" y2="226"/>
<text class="muted" x="486.7" y="242" font-size="11" text-anchor="middle">10 Hz</text>
<line class="grid" x1="673.3" y1="70" x2="673.3" y2="226"/>
<text class="muted" x="673.3" y="242" font-size="11" text-anchor="middle">20 Hz</text>
<line class="grid" x1="860.0" y1="70" x2="860.0" y2="226"/>
<text class="muted" x="860.0" y="242" font-size="11" text-anchor="middle">30 Hz</text>
<text class="ink" x="24" y="92" font-size="13" font-weight="700">모든 구동 보드</text>
<text class="muted" x="24" y="109" font-size="11.5">~2026-10-15</text>
<path class="barold" d="M300,82 h81.9 a4,4 0 0 1 4,4 v20 a4,4 0 0 1 -4,4 h-81.9 z"/>
<text class="ink" x="393.9" y="101" font-size="12.5" font-weight="700">≈4.6 Hz</text>
<text class="muted" x="455.9" y="101" font-size="11.5">velocity2 응답을 ETX 까지 기다리다 0.2 s 타임아웃</text>
<text class="ink" x="24" y="142" font-size="13" font-weight="700">구형 M 구동 보드</text>
<text class="muted" x="24" y="159" font-size="11.5">~2026-11-16</text>
<path class="barold" d="M300,132 h89.3 a4,4 0 0 1 4,4 v20 a4,4 0 0 1 -4,4 h-89.3 z"/>
<text class="ink" x="401.3" y="151" font-size="12.5" font-weight="700">약 5 Hz</text>
<text class="muted" x="463.3" y="151" font-size="11.5">16바이트 응답을 20바이트로 기다리다 타임아웃</text>
<text class="ink" x="24" y="192" font-size="13" font-weight="700">TETRA-M (현재)</text>
<text class="muted" x="24" y="209" font-size="11.5">2026-11-26 실측</text>
<path class="bar" d="M300,182 h556.0 a4,4 0 0 1 4,4 v20 a4,4 0 0 1 -4,4 h-556.0 z"/>
<text class="white" x="850.0" y="201" font-size="12.5" font-weight="700" text-anchor="end">30.0 Hz</text>
<line class="base" x1="300" y1="70" x2="300" y2="226"/></svg>
