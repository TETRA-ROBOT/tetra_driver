<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 470" width="920" height="470" font-family="-apple-system,'Segoe UI','Noto Sans KR','Malgun Gothic',sans-serif" role="img" aria-label="30 Hz 시리얼 폴링 루프">
<title>30 Hz 시리얼 폴링 루프</title>
<style>
.card{fill:#ffffff;stroke:#d0d7de}
.ink{fill:#1f2328}.muted{fill:#59636e}.white{fill:#ffffff}
.node{fill:#f6f8fa;stroke:#263238;stroke-width:1.5}
.board{fill:#263238}.boardt{fill:#ffffff}.boardm{fill:#b0bec5}
.topic{fill:#ffffff;stroke:#8c959f}
.wire{stroke:#263238;stroke-width:2;fill:none}
.arrow{stroke:#59636e;stroke-width:1.5;fill:none}
.arrowhead{fill:#59636e}
.req{fill:#00897B}.rep{fill:#FBC02D}.rept{fill:#263238}
.hl{fill:#00897B;fill-opacity:.14;stroke:#00897B;stroke-width:1}
.red{fill:#E53935}
.glow{fill:none;stroke:#00897B;stroke-width:2.5}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
@media (prefers-color-scheme: dark){
 .card{fill:#161b22;stroke:#30363d}
 .ink{fill:#e6edf3}.muted{fill:#9198a1}
 .node{fill:#1f262d;stroke:#8b949e}
 .board{fill:#37474f}.boardm{fill:#cfd8dc}
 .topic{fill:#0d1117;stroke:#484f58}
 .wire{stroke:#8b949e}
 .arrow{stroke:#9198a1}.arrowhead{fill:#9198a1}
 .hl{fill:#26a69a;fill-opacity:.22;stroke:#26a69a}
 .glow{stroke:#26a69a}
}

@keyframes wstep{0%,19.99%{transform:translateY(0)}20%,39.99%{transform:translateY(24px)}40%,59.99%{transform:translateY(48px)}60%,79.99%{transform:translateY(72px)}80%,100%{transform:translateY(96px)}}
@keyframes pstep{0%,33.32%{transform:translateY(0)}33.33%,66.65%{transform:translateY(24px)}66.66%,100%{transform:translateY(48px)}}
@keyframes req{0%{opacity:1;transform:translateX(0)}8%{opacity:1;transform:translateX(66px)}8.5%,100%{opacity:0;transform:translateX(66px)}}
@keyframes rep{0%,9.99%{opacity:0;transform:translateX(0)}10%{opacity:1;transform:translateX(0)}18%{opacity:1;transform:translateX(-66px)}18.5%,100%{opacity:0;transform:translateX(-66px)}}
@keyframes glow20{0%,18%{opacity:1}20%,100%{opacity:0}}
@keyframes glow33{0%,31%{opacity:1}33%,100%{opacity:0}}
.wh{animation:wstep 6s infinite}.ph{animation:pstep 6s infinite}
.pk{opacity:0;animation:req 6s linear infinite}
.pr{opacity:0;animation:rep 6s linear infinite}
.g20{opacity:0;animation:glow20 6s infinite}
.g33{opacity:0;animation:glow33 6s infinite}
@media (prefers-reduced-motion: reduce){.anim{animation:none!important}}</style>
<rect class="card" x="1" y="1" width="918" height="468" rx="14"/>
<text class="ink" x="24" y="36" font-size="18" font-weight="700">30 Hz 시리얼 폴링 — 드라이버가 한 주기에 보드와 주고받는 것</text>
<text class="muted" x="24" y="58" font-size="12.5">한 주기 = 33 ms (rclcpp::WallRate 30, 스레드 하나). 그림은 천천히 돌립니다.</text>
<text class="muted" x="24" y="88" font-size="12" font-weight="700">ROS 2</text>
<rect class="topic" x="24" y="98" width="246" height="44" rx="8"/>
<rect class="glow anim g20" style="animation-delay:0s" x="24" y="98" width="246" height="44" rx="8"/>
<text class="ink mono" x="36" y="117" font-size="11">cmd_vel_nav2 · cmd_vel_manual</text>
<text class="muted" x="36" y="134" font-size="11.5">속도 명령 (0.5 s 끊기면 정지)</text>
<line class="arrow" x1="272" y1="120" x2="295" y2="120"/><path class="arrowhead" d="M302,120 l-8,-4.5 v9 z"/>
<rect class="topic" x="24" y="150" width="246" height="44" rx="8"/>
<rect class="glow anim g20" style="animation-delay:4.8s" x="24" y="150" width="246" height="44" rx="8"/>
<text class="ink mono" x="36" y="169" font-size="11">/odom · /tf</text>
<text class="muted" x="36" y="186" font-size="11.5">odom → base_footprint</text>
<line class="arrow" x1="302" y1="172" x2="279" y2="172"/><path class="arrowhead" d="M272,172 l8,-4.5 v9 z"/>
<rect class="topic" x="24" y="202" width="246" height="44" rx="8"/>
<rect class="glow anim g20" style="animation-delay:0s" x="24" y="202" width="246" height="44" rx="8"/>
<text class="ink mono" x="36" y="221" font-size="11">/emg_state · /bumper_data</text>
<text class="muted" x="36" y="238" font-size="11.5">비상정지·범퍼·모터 에러</text>
<line class="arrow" x1="302" y1="224" x2="279" y2="224"/><path class="arrowhead" d="M272,224 l8,-4.5 v9 z"/>
<rect class="topic" x="24" y="272" width="246" height="52" rx="8"/>
<rect class="glow anim g33" style="animation-delay:4.0s" x="24" y="272" width="246" height="52" rx="8"/>
<text class="ink mono" x="36" y="291" font-size="11">/tetra_battery · /battery_voltage</text>
<text class="muted" x="36" y="308" font-size="11.5">/gpio_status · /docking_status</text>
<line class="arrow" x1="302" y1="298" x2="279" y2="298"/><path class="arrowhead" d="M272,298 l8,-4.5 v9 z"/>
<rect class="topic" x="24" y="336" width="246" height="52" rx="8"/>
<rect class="glow anim g33" style="animation-delay:0s" x="24" y="336" width="246" height="52" rx="8"/>
<text class="ink mono" x="36" y="355" font-size="11">led_cmd · power_*_cmd ·</text>
<text class="muted" x="36" y="372" font-size="11.5">~/raw_command (서비스)</text>
<line class="arrow" x1="272" y1="362" x2="295" y2="362"/><path class="arrowhead" d="M302,362 l-8,-4.5 v9 z"/>
<rect class="node" x="304" y="80" width="320" height="176" rx="10"/>
<text class="ink mono" x="318" y="104" font-size="14" font-weight="700">tetra_wheel_driver</text>
<text class="muted mono" x="610" y="104" font-size="11.5" text-anchor="end">/dev/ttyS0</text>
<rect class="hl anim wh" x="312" y="116" width="304" height="22" rx="5"/>
<text class="ink" x="320" y="132" font-size="12.5">① spin_some: 속도 명령·서비스 처리</text>
<text class="ink" x="320" y="156" font-size="12.5">② AC1 → 오도메트리 (x, y, θ) 읽기</text>
<text class="ink" x="320" y="180" font-size="12.5">③ BV → 좌·우 바퀴 속도 보내기</text>
<text class="ink" x="320" y="204" font-size="12.5">④ AA → 범퍼·비상정지·모터 에러 읽기</text>
<text class="ink" x="320" y="228" font-size="12.5">⑤ /odom·/tf 발행 → 33 ms 까지 대기</text>
<rect class="node" x="304" y="272" width="320" height="116" rx="10"/>
<text class="ink mono" x="318" y="296" font-size="14" font-weight="700">tetra_power_driver</text>
<text class="muted mono" x="610" y="296" font-size="11.5" text-anchor="end">/dev/ttyS1</text>
<rect class="hl anim ph" x="312" y="308" width="304" height="22" rx="5"/>
<text class="ink" x="320" y="324" font-size="12.5">① spin_some: 서비스 처리 (LED·전원·raw)</text>
<text class="ink" x="320" y="348" font-size="12.5">② PQ → 배터리·전압·전류·IO·초음파 읽기</text>
<text class="ink" x="320" y="372" font-size="12.5">③ 상태 발행 → 33 ms 까지 대기</text>
<rect class="board" x="742" y="80" width="154" height="176" rx="10"/>
<rect class="red" x="742" y="248" width="154" height="8"/>
<text class="boardt" x="819" y="160.0" font-size="15" font-weight="700" text-anchor="middle">구동 보드</text>
<text class="boardm" x="819" y="180.0" font-size="11.5" text-anchor="middle">좌·우 모터 컨트롤러</text>
<text class="boardm" x="819" y="196.0" font-size="11.5" text-anchor="middle">오도메트리를 보드가 계산</text>
<rect class="board" x="742" y="272" width="154" height="116" rx="10"/>
<rect class="red" x="742" y="380" width="154" height="8"/>
<text class="boardt" x="819" y="322.0" font-size="15" font-weight="700" text-anchor="middle">전원 보드</text>
<text class="boardm" x="819" y="342.0" font-size="11.5" text-anchor="middle">배터리·충전 접점</text>
<text class="boardm" x="819" y="358.0" font-size="11.5" text-anchor="middle">GPIO·LED·초음파·리프트</text>
<line class="wire" x1="624" y1="168" x2="742" y2="168"/>
<text class="muted" x="683" y="138" font-size="11" text-anchor="middle">RS232</text>
<line class="wire" x1="624" y1="330" x2="742" y2="330"/>
<text class="muted" x="683" y="300" font-size="11" text-anchor="middle">RS232</text>
<g class="pk anim" style="animation-delay:1.2s"><rect class="req" x="628" y="147" width="44" height="17" rx="4"/><text class="white mono" x="650" y="159.5" font-size="11" font-weight="700" text-anchor="middle">AC1</text></g>
<g class="pr anim" style="animation-delay:1.2s"><rect class="rep" x="694" y="172" width="44" height="17" rx="4"/><text class="rept mono" x="716" y="184.5" font-size="10" font-weight="700" text-anchor="middle">응답</text></g>
<g class="pk anim" style="animation-delay:2.4s"><rect class="req" x="628" y="147" width="44" height="17" rx="4"/><text class="white mono" x="650" y="159.5" font-size="11" font-weight="700" text-anchor="middle">BV</text></g>
<g class="pr anim" style="animation-delay:2.4s"><rect class="rep" x="694" y="172" width="44" height="17" rx="4"/><text class="rept mono" x="716" y="184.5" font-size="10" font-weight="700" text-anchor="middle">응답</text></g>
<g class="pk anim" style="animation-delay:3.6s"><rect class="req" x="628" y="147" width="44" height="17" rx="4"/><text class="white mono" x="650" y="159.5" font-size="11" font-weight="700" text-anchor="middle">AA</text></g>
<g class="pr anim" style="animation-delay:3.6s"><rect class="rep" x="694" y="172" width="44" height="17" rx="4"/><text class="rept mono" x="716" y="184.5" font-size="10" font-weight="700" text-anchor="middle">응답</text></g>
<g class="pk anim" style="animation-delay:2.0s"><rect class="req" x="628" y="309" width="44" height="17" rx="4"/><text class="white mono" x="650" y="321.5" font-size="11" font-weight="700" text-anchor="middle">PQ</text></g>
<g class="pr anim" style="animation-delay:2.0s"><rect class="rep" x="694" y="334" width="44" height="17" rx="4"/><text class="rept mono" x="716" y="346.5" font-size="10" font-weight="700" text-anchor="middle">응답</text></g>
<rect class="req" x="24" y="408" width="34" height="15" rx="4"/><text class="ink" x="64" y="420" font-size="12">요청 (드라이버 → 보드)</text>
<rect class="rep" x="212" y="408" width="34" height="15" rx="4"/><text class="ink" x="252" y="420" font-size="12">응답 (보드 → 드라이버)</text>
<text class="muted" x="24" y="448" font-size="12">읽기에 계속 실패하면: 구동 보드 15번(≈0.5 s) → /odom 발행 중단 · 전원 보드 3번 → /power_status -10, 서보 OFF. 둘 다 2 s 마다 포트를 다시 엽니다.</text></svg>
